name: CI Pipeline

on: push

jobs:
  lint:
    strategy:
       matrix: 
          os: [macos-latest, windows-latest, ubuntu-latest]
          python-version: [3.10, 3.11, 3.12]
  
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Steup python
        uses: actions/setup-python@v5
        with:
            python-version: ${{ matrix.python-version }}
      
      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: flake8 .