name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint:
    strategy:
      matrix: 
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: |
          flake8 . --count --max-line-length=100 --exclude=docs/ --extend-ignore=E231,W293 --statistics
  
  test:
    needs: lint
    strategy:
        matrix:
            os: [ubuntu-latest]
            python-version: ["3.11", "3.12"]
    
    runs-on: ${{ matrix.os }}
    steps:
        - name: Checkout Codes
          uses: actions/checkout@v4

        - name: Setup python
          uses: actions/setup-python@v5 
          with:
            python-version: ${{ matrix.python-version }}

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest

        - name: Setup DVC auth
          run: |
            dvc remote modify origin auth basic
            dvc remote modify origin user ${{ secrets.DAGSHUB_USER_NAME }}
            dvc remote modify origin password ${{ secrets.DAGSHUB_TOKEN }}

        - name: Pull Data from DagsHub
          run: |
            dvc pull
            mkdir -p /tmp/predictive_maintenance/data/raw/
            cp data/raw/predictive_maintenance.csv /tmp/predictive_maintenance/data/raw/
          
        - name: Run test
          run: |
            pytest -v

  production:
    needs: test
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Codes
          uses: actions/checkout@v4
        
        - name: Python setup
          uses: actions/setup-python@v5 
          with:
            python-version: "3.12"
        
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest
            pip install dvc
          
        - name: Setup DVC auth
          run: |
             dvc remote modify origin --local auth basic
             dvc remote modify origin --local user ${{ secrets.DAGSHUB_USER_NAME }}
             dvc remote modify origin --local password ${{ secrets.DAGSHUB_TOKEN }}

        - name: Pull Data 
          run: |
            dvc pull

        - name: Test Model production
          run: |
             python -m pytest tests/test_quality_gate.py -k "test_model_production_pass"
        
        - name: Prmote Model to Production
          if: success()
          env:
            DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
            DAGSHUB_USER_NAME: ${{ secrets.DAGSHUB_USER_NAME }}
            DAGSHUB_REPO_NAME: ${{ secrets.DAGSHUB_REPO_NAME }}
          run: |
              python src/models/transition_model.py

    build-and-deploy:
      needs: production
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write

      steps:
          - name: Checkout code
            uses: actions/checkout@v4

          - name: Log in to GHCR
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}
          
          - name: Set lowercase image name
            run: |
              echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

          - name: Build and push Docker image
            uses: docker/build-push-action@v5
            with:
              context: .
              push: true
              tags: ghcr.io/${{ env.IMAGE_NAME }}:latest

          - name: Trigger Render Deploy
            run: |
              curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"