name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  lint:
    strategy:
      matrix: 
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8
        run: |
          flake8 . --count --max-line-length=100 --exclude=docs/ --extend-ignore=E231,W293 --statistics
  
  test:
    needs: lint
    strategy:
        matrix:
            os: [ubuntu-latest]
            python-version: ["3.11", "3.12"]
    
    runs-on: ${{ matrix.os }}
    steps:
        - name: Checkout Codes
          uses: actions/checkout@v4

        - name: Setup python
          uses: actions/setup-python@v5 
          with:
            python-version: ${{ matrix.python-version }}

        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt
            pip install pytest
        
        - name: Run test
          run: |
            pytest -v

  production:
    needs: test
    runs-on: ubuntu-latest
    steps:
        - name: Checkout Codes
          uses: actions/checkout@v4
        
        - name: Python setup
          uses: actions/setup-python@v5 
          with:
            python-version: "3.12"
        
        - name: Install dependencies
          run: |
            pip install -r requirements.txt

        - name: Test Model production
          run: |
             python -m pytest tests/test_quality_gate.py -k "test_model_production_pass"
        
        - name: Prmote Model to Production
          if: success()
          env:
            DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }} 
          run: |
              python src/models/transition_model.py
